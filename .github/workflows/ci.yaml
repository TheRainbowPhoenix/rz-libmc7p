name: ci

on:
  push:
    branches: [dev, main, master]
  pull_request:
  workflow_dispatch:

jobs:
  linux-tests:
    name: tests + zymatik differential (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # meson from apt, NOT pip: pip would do a --user install into
      # ~/.local, and any `sudo ninja install` step re-runs the meson
      # recorded at setup time as root -- root cannot see the user's
      # ~/.local site-packages -> ModuleNotFoundError: mesonbuild
      - name: Install meson + ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build

      - name: Build (no rizin dependency)
        run: |
          meson setup build-ci -Dbuild_shared_libs=false
          ninja -C build-ci

      - name: Unit tests (test_simatic + test_mc7plus)
        run: meson test -C build-ci --print-errorlogs

  linux-plugin:
    name: linux x64 rizin plugin + cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # meson from apt, NOT pip: `sudo ninja -C rzbuild install` re-runs
      # the meson recorded at setup time as root; a pip --user meson in
      # ~/.local is invisible to root -> ModuleNotFoundError: mesonbuild
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config meson ninja-build

      - name: Build rizin v0.9.1 from source (plugin ABI reference)
        # -Denable_tests/-Denable_rz_test=false skips rizin's own 2500+
        # test binaries (test/integration/*, test/unit/*): we only need
        # the SDK (headers + shared libs + the rizin binary)
        run: |
          git clone --depth 1 --branch v0.9.1 --recurse-submodules \
            --shallow-submodules https://github.com/rizinorg/rizin.git
          meson setup rzbuild rizin -Ddefault_library=shared --prefix=/usr/local \
            -Denable_tests=false -Denable_rz_test=false
          ninja -C rzbuild
          sudo ninja -C rzbuild install
          sudo ldconfig

      - name: Build + package rz_libmc7p.so + libmc7_arch.so + libmc7_bin.so + dis_mc7plus
        run: sh scripts/build_linux_plugin.sh dist

      - name: Smoke-test the plugins inside real rizin
        run: python3 scripts/smoke_rizin_plugin.py dist/rz-libmc7p-linux64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rz-libmc7p-linux64
          path: dist/rz-libmc7p-linux64/

  windows-dll:
    name: windows x64 plugin dll + exe
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - uses: mlugg/setup-zig@v2

      - name: Fetch official rizin Windows shared SDK (v0.9.1)
        run: |
          curl -sL -o rz-win.zip https://github.com/rizinorg/rizin/releases/download/v0.9.1/rizin-windows-shared64-v0.9.1.zip
          unzip -q rz-win.zip
          echo "RZ_WIN_SDK=$PWD/rizin-win-installer-clang_cl-64" >> "$GITHUB_ENV"

      - name: Build rz_libmc7p.dll + libmc7_arch.dll + libmc7_bin.dll + dis_mc7plus.exe
        run: sh scripts/build_win_plugin.sh dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rz-libmc7p-win64
          path: dist/rz-libmc7p-win64/